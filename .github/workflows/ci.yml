name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: siliconcove_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, ctype, json, openssl, tokenizer, xml
          coverage: none

      - name: Copy .env
        run: |
          cp .env.example .env
          php -r "file_put_contents('.env', str_replace('DB_DATABASE=your_database_name', 'DB_DATABASE=siliconcove_test', file_get_contents('.env')));"
          php -r "file_put_contents('.env', str_replace('DB_USERNAME=your_username', 'DB_USERNAME=root', file_get_contents('.env')));"
          php -r "file_put_contents('.env', str_replace('DB_PASSWORD=your_password', 'DB_PASSWORD=', file_get_contents('.env')));"
          php -r "file_put_contents('.env', str_replace('DB_HOST=127.0.0.1', 'DB_HOST=127.0.0.1', file_get_contents('.env')));"

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Execute tests
        run: phpunit
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: siliconcove_test
          DB_USERNAME: root
          DB_PASSWORD: ""
